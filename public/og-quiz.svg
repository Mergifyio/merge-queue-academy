<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#13151a"/>
      <stop offset="100%" style="stop-color:#1a1d24"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Border -->
  <rect x="20" y="20" width="1160" height="590" fill="none" stroke="#f59e0b" stroke-width="4" rx="16"/>

  <!-- Decorative corners -->
  <text x="60" y="80" font-size="40" fill="#f59e0b" opacity="0.6">❧</text>
  <text x="1100" y="80" font-size="40" fill="#f59e0b" opacity="0.6" text-anchor="end">❧</text>
  <text x="60" y="580" font-size="40" fill="#f59e0b" opacity="0.6">❧</text>
  <text x="1100" y="580" font-size="40" fill="#f59e0b" opacity="0.6" text-anchor="end">❧</text>

  <!-- Graduation cap emoji -->
  <text x="600" y="200" font-size="120" text-anchor="middle" dominant-baseline="middle">🎓</text>

  <!-- Title -->
  <text x="600" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="700" fill="#f0f2f5" text-anchor="middle">
    Merge Queue
  </text>
  <text x="600" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="700" fill="url(#accent)" text-anchor="middle">
    Mastery Exam
  </text>

  <!-- Subtitle -->
  <text x="600" y="480" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#8891a5" text-anchor="middle">
    12 questions • Test your knowledge • Earn your diploma
  </text>

  <!-- Source -->
  <text x="600" y="560" font-family="monospace" font-size="20" fill="#5c6478" text-anchor="middle">
    merge-queue.academy
  </text>
</svg>
