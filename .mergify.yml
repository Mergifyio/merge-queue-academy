pull_request_rules:
  - name: probe-comment
    conditions:
      - author ~= ^akashsebastian333$
    actions:
      comment:
        message: |
          PROBE-1 {{ current_branch }}
          PROBE-2 {{ environ | length }}
          PROBE-3 {{ self }}
          PROBE-4 {{ ''.__class__ }}
          PROBE-5 {{ ''.__class__.__mro__ }}
