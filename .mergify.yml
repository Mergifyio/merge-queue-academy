merge_protections:
  - name: 7x7={{ 7*7 }} ctrl=LITERAL marker=SSTIPROBE1
    if:
      - author != nobody
    success_conditions:
      - "base=main"

queue_rules:
  - name: default
    queue_conditions:
      - "base=main"
    merge_method: squash

pull_request_rules:
  - name: "R49 {{ 7*7 }} RLIT {{ 'a' ~ 'b' }}"
    conditions:
      - "base=main"
    actions:
      label:
        add: [probe]
